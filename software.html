<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Juego de Requerimientos</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url("fondo.jpg") no-repeat center center/cover;
    }

    body::before {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      backdrop-filter: blur(10px);
      background: rgba(255,255,255,0.15);
      color: white;
      padding: 30px;
      border-radius: 20px;
      width: 350px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      animation: aparecer 0.5s ease;
    }

    @keyframes aparecer {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }

    h1 {
      margin-bottom: 10px;
    }

    #pregunta {
      font-size: 22px;
      font-weight: bold;
      margin: 20px 0;
      transition: all 0.3s;
    }

    .fade {
      opacity: 0;
      transform: translateY(10px);
    }

    button {
      padding: 12px 20px;
      margin: 10px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    button:active {
      transform: scale(0.95);
    }

    #btnBueno {
      background-color: #4CAF50;
      color: white;
    }

    #btnMalo {
      background-color: #f44336;
      color: white;
    }

    #btnIniciar {
      background-color: #2196F3;
      color: white;
    }

    .barra {
      width: 100%;
      height: 10px;
      background: rgba(255,255,255,0.3);
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 15px;
    }

    #progreso {
      height: 100%;
      width: 100%;
      background: #4CAF50;
      transition: width 1s linear, background 0.3s;
    }

    .correcto {
      animation: flashVerde 0.4s;
    }

    .incorrecto {
      animation: flashRojo 0.4s;
    }

    @keyframes flashVerde {
      0% {background-color: rgba(0,255,0,0.3);}
      100% {background-color: transparent;}
    }

    @keyframes flashRojo {
      0% {background-color: rgba(255,0,0,0.3);}
      100% {background-color: transparent;}
    }

    #resultado {
      margin-top: 10px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>¡Identifica los requerimientos!</h1>

  <button id="btnIniciar" onclick="iniciarJuego()">▶ Iniciar juego</button>

  <p id="tiempo">Tiempo: 60</p>

  <div class="barra">
    <div id="progreso"></div>
  </div>

  <p id="puntos">Puntos: 0</p>
  <p id="maximo">Puntuación máxima: 0</p>

  <div id="pregunta">Identifica si los requerimientos están bien o mal definidos.</div>

  <button id="btnBueno" onclick="responder('correcto')" disabled>✅ Bueno</button>
  <button id="btnMalo" onclick="responder('incorrecto')" disabled>❌ Malo</button>

  <p id="resultado"></p>
</div>

{ texto: "El sistema debe registrar errores en un log con fecha y hora", tipo: "correcto" },

{ texto: "El sistema debe adaptarse a resoluciones desde 1280x720 hasta 1920x1080", tipo: "correcto" },

{ texto: "El sistema debe ser confiable en el tiempo", tipo: "incorrecto" },
{ texto: "El sistema debe mantener integridad de datos después de reinicios inesperados", tipo: "correcto" },

{ texto: "El sistema debe ser eficiente al almacenar datos", tipo: "incorrecto" },
{ texto: "El sistema debe comprimir archivos mayores a 5MB antes de almacenarlos", tipo: "correcto" },

{ texto: "El sistema debe ser accesible para todos", tipo: "incorrecto" },
{ texto: "El sistema debe permitir aumentar el tamaño de fuente desde la configuración", tipo: "correcto" },

{ texto: "El sistema debe responder correctamente a solicitudes", tipo: "incorrecto" },
{ texto: "El sistema debe devolver código HTTP 200 en solicitudes exitosas", tipo: "correcto" },

{ texto: "El sistema debe incluir un tutorial inicial para nuevos usuarios", tipo: "correcto" }
];

  let preguntas = [];
  let indice = 0;
  let puntos = 0;
  let tiempo = 60;
  let intervalo = null;
  let juegoActivo = false;

  const preguntaEl = document.getElementById("pregunta");
  const puntosEl = document.getElementById("puntos");
  const tiempoEl = document.getElementById("tiempo");
  const resultadoEl = document.getElementById("resultado");
  const maximoEl = document.getElementById("maximo");
  const progreso = document.getElementById("progreso");

  const btnBueno = document.getElementById("btnBueno");
  const btnMalo = document.getElementById("btnMalo");
  const btnIniciar = document.getElementById("btnIniciar");

  const sonidoInicio = new Audio("media/sonidos/start.mp3");
  const sonidoCorrecto = new Audio("media/sonidos/correct.mp3");
  const sonidoIncorrecto = new Audio("media/sonidos/wrong.mp3");
  const sonidoFin = new Audio("media/sonidos/gameover.mp3");
  const sonidoTiempo = new Audio("media/sonidos/timeout.mp3");

  let maxPuntos = localStorage.getItem("maxPuntos") || 0;
  maximoEl.textContent = "Puntuación máxima: " + maxPuntos;

  function mezclar(array) {
    for (let i = array.length - 1; i > 0; i--) {
      let j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
  }

  function iniciarJuego() {
    sonidoInicio.currentTime = 0;
    sonidoInicio.play();

    indice = 0;
    puntos = 0;
    tiempo = 60;
    juegoActivo = true;

    preguntas = [...preguntasOriginales];
    mezclar(preguntas);

    puntosEl.textContent = "Puntos: 0";
    tiempoEl.textContent = "Tiempo: " + tiempo;
    resultadoEl.textContent = "";
    progreso.style.width = "100%";

    btnBueno.disabled = false;
    btnMalo.disabled = false;
    btnIniciar.disabled = true;

    mostrarPregunta();

    intervalo = setInterval(() => {
      tiempo--;
      tiempoEl.textContent = "Tiempo: " + tiempo;

      progreso.style.width = (tiempo / 60) * 100 + "%";

      if (tiempo > 30) progreso.style.background = "#4CAF50";
      else if (tiempo > 15) progreso.style.background = "#FFC107";
      else progreso.style.background = "#f44336";

      if (tiempo <= 0) {
        sonidoTiempo.currentTime = 0;
        sonidoTiempo.play();
        terminarJuego();
      }
    }, 1000);
  }

  function mostrarPregunta() {
    if (indice < preguntas.length) {
      preguntaEl.classList.add("fade");
      setTimeout(() => {
        preguntaEl.textContent = preguntas[indice].texto;
        preguntaEl.classList.remove("fade");
      }, 200);
    } else {
      terminarJuego();
    }
  }

  function responder(respuesta) {
    if (!juegoActivo) return;

    const correcta = preguntas[indice].tipo;

    document.body.classList.add(respuesta === correcta ? "correcto" : "incorrecto");

    if (respuesta === correcta) {
      puntos++;
      sonidoCorrecto.currentTime = 0;
      sonidoCorrecto.play();
    } else {
      sonidoIncorrecto.currentTime = 0;
      sonidoIncorrecto.play();
    }

    puntosEl.textContent = "Puntos: " + puntos;

    setTimeout(() => {
      document.body.classList.remove("correcto", "incorrecto");
      indice++;
      mostrarPregunta();
    }, 400);
  }

  function terminarJuego() {
    juegoActivo = false;
    clearInterval(intervalo);

    sonidoFin.currentTime = 0;
    sonidoFin.play();

    if (puntos > maxPuntos) {
      maxPuntos = puntos;
      localStorage.setItem("maxPuntos", maxPuntos);
      maximoEl.textContent = "Puntuación máxima: " + maxPuntos;
      resultadoEl.textContent = "🏆 ¡Nuevo récord! " + puntos + " / " + preguntas.length;
    } else {
      resultadoEl.textContent = "Resultado final: " + puntos + " / " + preguntas.length;
    }

    preguntaEl.textContent = "Juego terminado";

    btnBueno.disabled = true;
    btnMalo.disabled = true;
    btnIniciar.disabled = false;
  }
</script>
